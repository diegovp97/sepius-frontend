<div class="dashboard">
  <header class="dashboard__header">
    <div class="dashboard__left">
      <a class="brand" href="/" aria-label="Zona Sepia">
        <span class="brand__mark">Z</span>
        <span class="brand__name">Zona<span>Sepia</span></span>
      </a>

    </div>

    <div class="dashboard__actions">
      <button class="dashboard__btn" (click)="reconnectNow()"
        [disabled]="status() === 'loading'">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>
        </svg>
        Reconectar
      </button>
    </div>
  </header>

  <div class="dashboard__content">
    <div class="dashboard__player">

      <!-- Elemento <video> nativo: sin embed de Twitch, sin cookies, sin ban -->
      <video #videoEl
        class="dashboard__video"
        controls
        autoplay
        playsinline
        muted="false">
      </video>

      <!-- Overlay de carga -->
      @if (status() === 'loading') {
        <div class="dashboard__overlay">
          <div class="spinner"></div>
          <p class="overlay-title">Conectando con el directo…</p>
          <p class="overlay-sub">Esto tarda unos segundos</p>
        </div>
      }

      <!-- Overlay click-to-play (política de autoplay del navegador) -->
      @if (needsInteraction()) {
        <div class="dashboard__overlay dashboard__overlay--interact" (click)="clickToPlay()">
          <button class="play-btn-large" aria-label="Reproducir">
            <svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
          </button>
          <p class="overlay-title">Toca para reproducir</p>
        </div>
      }

      <!-- Overlay de error -->
      @if (status() === 'error') {
        <div class="dashboard__overlay dashboard__overlay--error">
          <img src="/ttblue.jpg" alt="elttblue" class="overlay-offline-img" />
          <p class="overlay-offline-text">Estoy trabajando obvio</p>
          @if (reconnectCountdown() > 0) {
            <p class="overlay-sub">Reintentando en <strong>{{ reconnectCountdown() }}s</strong></p>
          }
          <button class="dashboard__overlay-btn" (click)="reconnectNow()">
            Comprobar de nuevo
          </button>
        </div>
      }
    </div>

    <!-- Chat personalizado con SignalR -->
    <aside class="dashboard__chat">
      <app-chat [channel]="channel" />
    </aside>
  </div>
</div>
